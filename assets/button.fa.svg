<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 96" width="460" height="96" role="img" aria-label="باز کردن ویزارد راه‌اندازی">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#ef4444"/></linearGradient>
    <clipPath id="c"><rect x="10" y="10" width="440" height="76" rx="38"/></clipPath>
  </defs>
  <style>
    text{font-family:'Segoe UI','Vazirmatn',Tahoma,system-ui,-apple-system,Arial,sans-serif}
    .halo{transform-box:fill-box;transform-origin:center;animation:halo 2.2s ease-out infinite}
    @keyframes halo{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.14,1.5);opacity:0}}
    .arrow{animation:nudge 1.2s ease-in-out infinite}
    @keyframes nudge{50%{transform:translateX(-7px)}}
    @media (prefers-reduced-motion:reduce){.halo,.arrow{animation:none}}
  </style>
  <rect class="halo" x="10" y="10" width="440" height="76" rx="38" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <rect x="10" y="10" width="440" height="76" rx="38" fill="url(#b)"/>
  <g clip-path="url(#c)">
    <rect x="520" y="-10" width="70" height="120" fill="#fff" fill-opacity=".30" transform="skewX(-20)">
      <animate attributeName="x" values="520;-120" dur="2.8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="245" y="58" text-anchor="middle" direction="rtl" font-size="26" font-weight="700" fill="#fff">باز کردن ویزارد راه‌اندازی</text>
  <g class="arrow"><path d="M78 48 h-34 m11 -11 l-11 11 l11 11" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
