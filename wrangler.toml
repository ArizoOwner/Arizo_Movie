name = "arizo-movie"
main = "worker.js"
compatibility_date = "2024-04-01"

# D1 database. database_id is intentionally omitted: wrangler 4.x provisions the
# database automatically on first `wrangler deploy` and records the binding.
[[d1_databases]]
binding = "DB"
database_name = "arizo-movie-db"

# Cron trigger: periodic webhook health check.
[triggers]
crons = ["*/30 * * * *"]

[vars]
PROJECT_NAME = "Arizo_Movie"
VERSION = "2.1.1"

# Required secret (never commit it):  npx wrangler secret put SETUP_KEY
# It protects the /setup wizard API. Without it the wizard refuses to save anything.
