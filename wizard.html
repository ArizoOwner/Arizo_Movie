<style>
:root{--bg:#0a0a0f;--bg2:radial-gradient(circle at 12% 8%,rgba(220,38,38,.30),transparent 42%),radial-gradient(circle at 88% 90%,rgba(245,158,11,.20),transparent 45%);--card:rgba(22,22,32,.82);--card2:rgba(34,34,48,.66);--line:rgba(255,255,255,.09);--text:#f8fafc;--muted:#a1a1aa;--dim:#71717a;--acc:#ef4444;--acc2:#f59e0b;--green:#34d399;--amber:#fbbf24;--rose:#f87171;--blue:#60a5fa;--r:16px;--font:'Vazirmatn',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',Consolas,monospace}
[data-theme="light"]{--bg:#f6f4f1;--bg2:radial-gradient(circle at 12% 8%,rgba(239,68,68,.13),transparent 42%),radial-gradient(circle at 88% 90%,rgba(245,158,11,.13),transparent 45%);--card:rgba(255,255,255,.92);--card2:rgba(245,243,240,.96);--line:rgba(15,23,42,.1);--text:#18181b;--muted:#52525b;--dim:#71717a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);background-image:var(--bg2);background-attachment:fixed;color:var(--text);line-height:1.7;min-height:100vh;padding:24px 16px 56px}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:760px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font-size:25px;box-shadow:0 8px 24px rgba(239,68,68,.38);animation:float 3.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-4px) rotate(-4deg)}}
.brand h1{font-size:1.15rem;font-weight:800}.brand small{color:var(--muted);font-size:.78rem;display:block}
.tools{display:flex;gap:8px}
.chip{background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:7px 14px;font:inherit;font-size:.8rem;cursor:pointer}
.chip:hover{border-color:var(--acc)}
.progress{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin:6px 0 18px}
.progress i{display:block;height:100%;width:4%;background:linear-gradient(90deg,var(--acc),var(--acc2),var(--green));background-size:200% 100%;animation:shine 3s linear infinite;transition:width .5s}
@keyframes shine{to{background-position:-200% 0}}
.notice{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border-radius:14px;margin-bottom:16px;font-size:.9rem;line-height:1.7;border:1px solid}
.notice.req{border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.1)}
.notice.done{border-color:rgba(52,211,153,.45);background:rgba(52,211,153,.1)}
.notice span{opacity:.85}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 40px rgba(0,0,0,.18);animation:rise .5s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.card h2{font-size:1.02rem;font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.card p.lead{color:var(--muted);font-size:.86rem;margin-bottom:12px}
.num{width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;display:inline-grid;place-items:center;font-size:.8rem;font-weight:800;flex:none}
.steps{list-style:none;display:grid;gap:8px;margin:0 0 14px}
.steps li{font-size:.86rem;color:var(--muted)}
.steps b{color:var(--text)}
.tabs{display:flex;gap:6px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
.tab{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:.84rem;font-weight:600;padding:9px 10px;border-radius:9px;cursor:pointer}
.tab.on{background:linear-gradient(135deg,var(--acc),#b91c1c);color:#fff}
label{display:block;font-size:.8rem;font-weight:600;margin:12px 0 6px}
.field{position:relative}
select{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 14px;font-family:var(--mono);font-size:.86rem;outline:none;direction:ltr;text-align:left}
input[type=text],input[type=password]{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 14px;font-family:var(--mono);font-size:.86rem;outline:none;direction:ltr;text-align:left}
input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(239,68,68,.18)}
.field input{padding-right:44px}
.eye{position:absolute;top:50%;right:10px;transform:translateY(-50%);background:none;border:0;color:var(--muted);cursor:pointer;font-size:1rem}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
button.btn,a.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--acc),#b91c1c);color:#fff;border:0;border-radius:12px;padding:12px 22px;font:inherit;font-weight:700;font-size:.9rem;cursor:pointer;text-decoration:none;box-shadow:0 8px 22px rgba(185,28,28,.3);transition:.15s}
button.btn:hover:not(:disabled),a.btn:hover{transform:translateY(-1px);text-decoration:none}
button.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--card2);color:var(--text);box-shadow:none;border:1px solid var(--line)}
.btn.big{padding:15px 30px;font-size:1rem;width:100%}
.status{font-size:.84rem;margin-top:10px;min-height:1.2em;overflow-wrap:anywhere}
.ok{color:var(--green)}.bad{color:var(--rose)}.warn{color:var(--amber)}
.hint{font-size:.78rem;color:var(--dim);margin-top:8px}
.log{list-style:none;display:grid;gap:8px}
.log li{display:flex;gap:10px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:.86rem}
.log .ic{width:22px;text-align:center;flex:none}
.log li.run .ic{animation:spin 1.1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.log li.run .ic::before{content:'⏳'}.log li.done .ic::before{content:'✅'}.log li.fail .ic::before{content:'❌'}.log li.wait .ic::before{content:'○';color:var(--dim)}
.log li.fail{border-color:rgba(248,113,113,.4)}
.kv{display:grid;gap:10px;margin:14px 0}
.kv div{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.kv span{font-size:.78rem;color:var(--muted);min-width:96px}
.kv code{font-family:var(--mono);font-size:.84rem;direction:ltr;overflow-wrap:anywhere;flex:1;text-align:left}
.kv button{background:none;border:0;color:var(--blue);cursor:pointer;font:inherit;font-size:.78rem}
.check{display:flex;gap:10px;align-items:flex-start;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:.88rem;cursor:pointer;margin:0 0 6px}
.check input{margin-top:5px;accent-color:var(--acc)}
.check small{color:var(--muted);font-size:.78rem;font-weight:400}
.hidden{display:none!important}
.errbox{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.4);color:var(--rose);border-radius:12px;padding:12px 14px;font-size:.84rem;margin-top:12px;overflow-wrap:anywhere}
.result{border-color:rgba(52,211,153,.4)}
footer{text-align:center;color:var(--dim);font-size:.76rem;margin-top:24px}
@media(max-width:560px){.kv div{flex-wrap:wrap}.kv span{min-width:100%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand"><div class="logo">🎬</div><div><h1>Arizo Movie</h1><small>SETUP WIZARD</small></div></div>
  <div class="tools">
    <button class="chip" id="langBtn" type="button">English</button>
    <button class="chip" id="themeBtn" type="button">☀️</button>
  </div>
</header>

<div class="progress"><i id="bar"></i></div>

<div class="notice req hidden" id="reqBanner"><b data-t="reqTitle"></b><span data-t="reqText"></span></div>
<div class="notice done hidden" id="doneBanner"><b data-t="doneBannerTitle"></b><span data-t="doneBannerText"></span></div>

<section class="card hidden" id="inst">
  <h2>🚀 <span data-t="iTitle"></span></h2>
  <p class="lead" data-t="iLead"></p>
  <ol class="steps">
    <li>🔹 <span data-t="cf1"></span></li>
    <li>🔹 <span data-t="cf2"></span></li>
  </ol>
  <a class="btn ghost" id="iCfLink" target="_blank" rel="noopener noreferrer" data-t="cfOpen"></a>
  <label for="iToken" data-t="cfLabel"></label>
  <div class="field"><input type="password" id="iToken" autocomplete="off" spellcheck="false" placeholder="Cloudflare API Token"><button class="eye" type="button" data-eye="iToken" aria-label="show">👁</button></div>
  <div class="row"><button class="btn" id="iVerify" type="button" data-t="verify"></button></div>
  <div class="status" id="iStatus"></div>
  <div id="iAcctBox" class="hidden"><label for="iAcct" data-t="iAcct"></label><select id="iAcct"></select></div>
  <div id="iSubBox" class="hidden">
    <label for="iSub" data-t="iSubLabel"></label>
    <div class="row" style="margin-top:0"><input type="text" id="iSub" placeholder="my-name" style="flex:1"><button class="btn ghost" id="iSubBtn" type="button" data-t="iSubBtn"></button></div>
  </div>
  <label for="iName" data-t="iName"></label>
  <input type="text" id="iName" value="arizo-movie" maxlength="54">
  <div class="row"><button class="btn big" id="iInstall" type="button" disabled data-t="iInstall"></button></div>
  <div class="hint" data-t="iHint"></div>
  <ul class="log hidden" id="iLog" style="margin-top:14px"></ul>
  <div class="errbox hidden" id="iErr"></div>
  <div class="hidden" id="iDone">
    <p class="lead" style="margin-top:14px" data-t="iDoneLead"></p>
    <div class="kv">
      <div><span data-t="iUrl"></span><code id="iUrl"></code><button type="button" data-copy="iUrl" data-t="copy"></button></div>
      <div><span data-t="iKey"></span><code id="iKey"></code><button type="button" data-copy="iKey" data-t="copy"></button></div>
    </div>
    <div class="errbox" style="background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.4);color:var(--amber)" data-t="iKeyWarn"></div>
    <div class="row"><a class="btn" id="iOpen" href="#" target="_blank" rel="noopener noreferrer" data-t="iOpen"></a></div>
  </div>
</section>

<section class="card" id="s1">
  <h2><span class="num">1</span><span data-t="s1title"></span></h2>
  <p class="lead" data-t="s1lead"></p>

  <div class="tabs" id="tabs">
    <button class="tab on" type="button" data-tab="cf" data-t="tabCf"></button>
    <button class="tab" type="button" data-tab="key" data-t="tabKey"></button>
  </div>

  <div id="paneCf">
    <ol class="steps">
      <li>🔹 <span data-t="cf1"></span></li>
      <li>🔹 <span data-t="cf2"></span></li>
    </ol>
    <a class="btn ghost" id="cfLink" target="_blank" rel="noopener noreferrer" data-t="cfOpen"></a>
    <label for="cfToken" data-t="cfLabel"></label>
    <div class="field"><input type="password" id="cfToken" autocomplete="off" spellcheck="false" placeholder="Cloudflare API Token"><button class="eye" type="button" data-eye="cfToken" aria-label="show">👁</button></div>
  </div>

  <div id="paneKey" class="hidden">
    <p class="hint" data-t="keyHelp"></p>
    <label for="setupKey" data-t="keyLabel"></label>
    <div class="field"><input type="password" id="setupKey" autocomplete="off" spellcheck="false" placeholder="SETUP_KEY"><button class="eye" type="button" data-eye="setupKey" aria-label="show">👁</button></div>
  </div>

  <div class="row"><button class="btn" id="authVerify" type="button" data-t="verify"></button></div>
  <div class="status" id="authStatus"></div>
  <div id="manageBox" class="hidden">
    <p class="hint" style="margin-top:14px" data-t="manageHelp"></p>
    <label class="check hidden" id="manageUpdRow"><input type="checkbox" id="manageUpd"> <span><b data-t="updTitle"></b><br><small data-t="updHelp"></small></span></label>
    <div class="row"><button class="btn ghost" id="manageBtn" type="button" data-t="manageBtn"></button></div>
  </div>
</section>

<section class="card" id="s2">
  <h2><span class="num">2</span><span data-t="s2title"></span></h2>
  <p class="lead" data-t="s2lead"></p>
  <label for="botToken" data-t="botLabel"></label>
  <div class="field"><input type="password" id="botToken" autocomplete="off" spellcheck="false" placeholder="123456789:AA…"><button class="eye" type="button" data-eye="botToken" aria-label="show">👁</button></div>
  <div class="row"><button class="btn ghost" id="botVerify" type="button" data-t="verify" disabled></button><a class="btn ghost" href="https://t.me/BotFather" target="_blank" rel="noopener noreferrer">@BotFather</a></div>
  <div class="status" id="botStatus"></div>

  <label for="tmdbKey" data-t="tmdbLabel"></label>
  <div class="field"><input type="password" id="tmdbKey" autocomplete="off" spellcheck="false" placeholder="TMDB API key (v3)"><button class="eye" type="button" data-eye="tmdbKey" aria-label="show">👁</button></div>
  <div class="row"><button class="btn ghost" id="tmdbVerify" type="button" data-t="verify" disabled></button><a class="btn ghost" href="https://www.themoviedb.org/settings/api" target="_blank" rel="noopener noreferrer">TMDB API</a></div>
  <div class="status" id="tmdbStatus"></div>
</section>

<section class="card" id="s3">
  <h2><span class="num">3</span><span data-t="s3title"></span></h2>
  <label class="check" id="updRow"><input type="checkbox" id="updOpt"> <span><b data-t="updTitle"></b><br><small data-t="updHelp"></small></span></label>
  <div class="row" style="margin-top:4px"><button class="btn big" id="install" type="button" disabled data-t="install"></button></div>
  <div class="hint" data-t="hint"></div>
</section>

<section class="card hidden" id="progressCard">
  <h2>⚙️ <span data-t="progress"></span></h2>
  <ul class="log" id="log"></ul>
  <div class="errbox hidden" id="errBox"></div>
  <div class="row hidden" id="retryRow"><button class="btn" id="retry" type="button" data-t="retry"></button></div>
</section>

<section class="card result hidden" id="resultCard">
  <h2>🎉 <span data-t="done"></span></h2>
  <p class="lead" data-t="doneLead"></p>
  <div class="kv">
    <div><span data-t="kvBot"></span><code id="rBot"></code><button type="button" data-copy="rBot" data-t="copy"></button></div>
    <div><span data-t="kvHook"></span><code id="rHook"></code><button type="button" data-copy="rHook" data-t="copy"></button></div>
  </div>
  <div class="row"><a class="btn" id="rOpen" href="#" target="_blank" rel="noopener noreferrer" data-t="openBot"></a></div>
  <div id="ownBox" class="hidden">
    <p class="lead" style="margin-top:18px" data-t="ownLead"></p>
    <div class="row"><a class="btn ghost" id="rOwn" href="#" target="_blank" rel="noopener noreferrer" data-t="ownBtn"></a></div>
    <div class="hint" data-t="ownHint"></div>
  </div>
  <div class="hint hidden" id="updNote"></div>
</section>

<footer>Arizo Movie · <span data-t="footer"></span></footer>
</div>

var lang=document.documentElement.getAttribute('lang')==='en'?'en':'fa';
function $(id){return document.getElementById(id)}
function applyLang(){
  document.documentElement.setAttribute('lang',lang);document.documentElement.setAttribute('dir',lang==='en'?'ltr':'rtl');
  var n=document.querySelectorAll('[data-t]');
  for(var i=0;i<n.length;i++){var v=T[lang][n[i].getAttribute('data-t')];if(typeof v==='string')n[i].textContent=v;}
  $('langBtn').textContent=lang==='en'?'فارسی':'English';
  try{localStorage.setItem('am_lang',lang)}catch(e){}
  renderLog();
}
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);$('themeBtn').textContent=t==='light'?'🌙':'☀️';try{localStorage.setItem('am_theme',t)}catch(e){}}
$('langBtn').onclick=function(){lang=lang==='en'?'fa':'en';applyLang();};
$('themeBtn').onclick=function(){applyTheme(document.documentElement.getAttribute('data-theme')==='light'?'dark':'light');};
$('cfLink').href=CF_TOKEN_URL;$('iCfLink').href=CF_TOKEN_URL;

var eyes=document.querySelectorAll('[data-eye]');
for(var e=0;e<eyes.length;e++){eyes[e].onclick=function(){var i=$(this.getAttribute('data-eye'));i.type=i.type==='password'?'text':'password';};}

var S={mode:'cf',auth:false,bot:null,tmdb:false,busy:false,bar:4,info:{configured:false,hasDb:false,hasKey:false,canUseToken:true}};
var STEP_STATE={},STEP_IDS=[];
var I={ok:false,accountId:'',subdomain:'',busy:false,list:[]};
function iApi(step,body){
  return fetch('/api/installer/'+step,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})})
    .then(function(r){return r.json().catch(function(){return {ok:false,fa:T.fa.badResp,en:T.en.badResp}})})
    .catch(function(){return {ok:false,fa:T.fa.net,en:T.en.net}});
}
function iRefresh(){
  var okName=/^[a-z0-9][a-z0-9-]{0,53}$/.test($('iName').value);
  $('iInstall').disabled=!(I.ok&&I.accountId&&I.subdomain&&okName)||I.busy;
}
function iFillAccounts(list){
  var sel=$('iAcct');sel.innerHTML='';var usable=[];
  for(var i=0;i<list.length;i++){
    if(!list[i].canWorkers||!list[i].canD1)continue;
    usable.push(list[i]);var o=document.createElement('option');o.value=list[i].id;o.textContent=list[i].name;sel.appendChild(o);
  }
  return usable;
}
function iPick(acc){I.accountId=acc.id;I.subdomain=acc.subdomain||'';$('iSubBox').classList.toggle('hidden',!!I.subdomain);iRefresh();}
$('iName').oninput=function(){this.value=this.value.toLowerCase();iRefresh();};
$('iAcct').onchange=function(){var a=I.list.filter(function(x){return x.id===$('iAcct').value})[0];if(a)iPick(a);};
$('iVerify').onclick=function(){
  var b=this,tk=$('iToken').value.trim();if(!tk)return;b.disabled=true;setStatus('iStatus','','…');
  iApi('verify',{cfToken:tk}).then(function(d){
    b.disabled=false;
    if(!d.ok){I.ok=false;setStatus('iStatus','bad','❌ '+msgOf(d));iRefresh();return;}
    I.list=iFillAccounts(d.accounts);
    if(!I.list.length){I.ok=false;setStatus('iStatus','bad','❌ '+T[lang].iPickAcct);iRefresh();return;}
    I.ok=true;$('iAcctBox').classList.toggle('hidden',I.list.length<2);iPick(I.list[0]);
    setStatus('iStatus',I.subdomain?'ok':'warn',I.subdomain?'✅ '+I.subdomain+'.workers.dev':'⚠️ '+T[lang].iNoSub);
  });
};
$('iSubBtn').onclick=function(){
  var name=$('iSub').value.trim().toLowerCase();if(!name)return;
  iApi('subdomain',{cfToken:$('iToken').value.trim(),accountId:I.accountId,subdomain:name}).then(function(d){
    if(!d.ok){setStatus('iStatus','bad','❌ '+msgOf(d));return;}
    I.subdomain=d.subdomain;$('iSubBox').classList.add('hidden');setStatus('iStatus','ok','✅ '+d.subdomain+'.workers.dev');iRefresh();
  });
};
function iLog(state){
  var ul=$('iLog');ul.classList.remove('hidden');ul.innerHTML='';
  ['resources','deploy','wait'].forEach(function(id){
    var li=document.createElement('li');li.className=state[id]||'wait';
    var ic=document.createElement('span');ic.className='ic';var tx=document.createElement('span');tx.textContent=T[lang].iSteps[id];
    li.appendChild(ic);li.appendChild(tx);ul.appendChild(li);
  });
}
function iFail(state,id,d){state[id]='fail';iLog(state);$('iErr').classList.remove('hidden');$('iErr').textContent='❌ '+msgOf(d);I.busy=false;iRefresh();}
function pollHealth(url,n){
  return fetch(url+'/health',{cache:'no-store'}).then(function(r){return r.ok}).catch(function(){return false}).then(function(ok){
    if(ok)return true;if(n>=25)return false;
    return new Promise(function(r){setTimeout(r,2000)}).then(function(){return pollHealth(url,n+1)});
  });
}
$('iInstall').onclick=function(){
  I.busy=true;iRefresh();$('iErr').classList.add('hidden');$('iDone').classList.add('hidden');
  var tk=$('iToken').value.trim(),name=$('iName').value.trim(),st={};iLog(st);
  st.resources='run';iLog(st);
  iApi('resources',{cfToken:tk,accountId:I.accountId,workerName:name}).then(function(r){
    if(!r.ok){iFail(st,'resources',r);return;}
    st.resources='done';st.deploy='run';iLog(st);
    return iApi('deploy',{cfToken:tk,accountId:I.accountId,workerName:name,dbId:r.dbId}).then(function(d){
      if(!d.ok){iFail(st,'deploy',d);return;}
      st.deploy='done';st.wait='run';iLog(st);
      return pollHealth(d.url,0).then(function(up){
        st.wait=up?'done':'fail';iLog(st);
        $('iUrl').textContent=d.url;$('iKey').textContent=d.setupKey;$('iOpen').href=d.url+'/setup';
        if(!up){$('iErr').classList.remove('hidden');$('iErr').textContent='⚠️ '+T[lang].iWait;}
        $('iToken').value='';$('iDone').classList.remove('hidden');$('iDone').scrollIntoView({behavior:'smooth',block:'center'});
        I.busy=false;
      });
    });
  });
};
function setStatus(id,cls,msg){var el=$(id);el.className='status '+cls;el.textContent=msg;}
function msgOf(d){return (d&&(lang==='en'?d.en:d.fa))||(d&&d.en)||'Error';}
function api(step,body){
  return fetch('/api/setup/'+step,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})})
    .then(function(r){return r.json().catch(function(){return {ok:false,fa:T.fa.badResp,en:T.en.badResp}})})
    .catch(function(){return {ok:false,fa:T.fa.net,en:T.en.net}});
}
function getStatus(){
  return fetch('/api/setup/status',{cache:'no-store'}).then(function(r){return r.json()}).catch(function(){return null});
}
function creds(){return S.mode==='cf'?{cfToken:$('cfToken').value.trim()}:{setupKey:$('setupKey').value.trim()};}
function withCreds(o){var c=creds(),k;for(k in c)o[k]=c[k];return o;}

function refresh(){
  $('botVerify').disabled=!(S.auth&&$('botToken').value.trim());
  $('tmdbVerify').disabled=!(S.auth&&$('tmdbKey').value.trim());
  $('install').disabled=!(S.auth&&S.bot&&S.tmdb)||S.busy;
  var n=(S.auth?1:0)+(S.bot?1:0)+(S.tmdb?1:0);
  $('bar').style.width=(S.bar>4?S.bar:(n===0?4:n===1?30:n===2?55:75))+'%';
}
$('botToken').oninput=function(){S.bot=null;refresh();};
$('tmdbKey').oninput=function(){S.tmdb=false;refresh();};

function setMode(m){
  S.mode=m;S.auth=false;$('updRow').classList.toggle('hidden',m!=='cf');
  var tabs=document.querySelectorAll('.tab');
  for(var i=0;i<tabs.length;i++)tabs[i].classList.toggle('on',tabs[i].getAttribute('data-tab')===m);
  $('paneCf').classList.toggle('hidden',m!=='cf');$('paneKey').classList.toggle('hidden',m!=='key');
  setStatus('authStatus','','');refresh();
}
var tabEls=document.querySelectorAll('.tab');
for(var t=0;t<tabEls.length;t++){tabEls[t].onclick=function(){setMode(this.getAttribute('data-tab'));};}

$('authVerify').onclick=function(){
  var b=this;b.disabled=true;setStatus('authStatus','','…');
  api(S.mode==='cf'?'cloudflare/verify':'key/verify',withCreds({})).then(function(d){
    b.disabled=false;S.auth=!!d.ok;
    setStatus('authStatus',d.ok?'ok':'bad',d.ok?'✅ '+(S.mode==='cf'?T[lang].cfOk:T[lang].keyOk):'❌ '+msgOf(d));
    $('manageBox').classList.toggle('hidden',!(d.ok&&S.info.configured));
    $('manageUpdRow').classList.toggle('hidden',S.mode!=='cf');
    refresh();
  });
};
$('botVerify').onclick=function(){
  var b=this;b.disabled=true;setStatus('botStatus','','…');
  api('telegram/verify',withCreds({botToken:$('botToken').value.trim()})).then(function(d){
    S.bot=d.ok?d.username:null;
    setStatus('botStatus',d.ok?'ok':'bad',d.ok?'✅ '+T[lang].botOk+'@'+d.username:'❌ '+msgOf(d));refresh();
  });
};
$('tmdbVerify').onclick=function(){
  var b=this;b.disabled=true;setStatus('tmdbStatus','','…');
  api('tmdb/verify',withCreds({tmdbKey:$('tmdbKey').value.trim()})).then(function(d){
    S.tmdb=!!d.ok;
    setStatus('tmdbStatus',d.ok?'ok':'bad',d.ok?'✅ '+T[lang].tmdbOk:'❌ '+msgOf(d));refresh();
  });
};

function renderLog(){
  var ul=$('log');if(!ul)return;ul.innerHTML='';
  for(var i=0;i<STEP_IDS.length;i++){
    var li=document.createElement('li');li.className=STEP_STATE[STEP_IDS[i]]||'wait';
    var ic=document.createElement('span');ic.className='ic';
    var tx=document.createElement('span');tx.textContent=T[lang].steps[STEP_IDS[i]];
    li.appendChild(ic);li.appendChild(tx);ul.appendChild(li);
  }
}
function fail(id,d){
  STEP_STATE[id]='fail';renderLog();
  $('errBox').classList.remove('hidden');$('errBox').textContent='❌ '+msgOf(d);
  $('retryRow').classList.remove('hidden');S.busy=false;refresh();
}
function waitForDb(n){
  return getStatus().then(function(s){
    if(s&&s.hasDb)return true;
    if(n>=15)return false;
    return new Promise(function(r){setTimeout(r,1500)}).then(function(){return waitForDb(n+1)});
  });
}
function install(manageOnly){
  S.manage=manageOnly===true;
  S.busy=true;refresh();
  $('progressCard').classList.remove('hidden');$('resultCard').classList.add('hidden');
  $('errBox').classList.add('hidden');$('retryRow').classList.add('hidden');
  $('progressCard').scrollIntoView({behavior:'smooth',block:'start'});
  getStatus().then(function(s){
    if(s)S.info=s;
    STEP_IDS=[];
    var wantUpd;
    if(S.manage){
      wantUpd=S.mode==='cf'&&$('manageUpd').checked;
      if(wantUpd)STEP_IDS.push('updates');
      STEP_IDS.push('owner');
    }else{
      if(!S.info.hasDb)STEP_IDS.push('database');
      STEP_IDS.push('save','webhook','commands');
      wantUpd=S.mode==='cf'&&$('updOpt').checked;
      if(S.mode==='cf')STEP_IDS.push('schedule');
      if(wantUpd)STEP_IDS.push('updates');
      STEP_IDS.push('owner');
    }
    STEP_STATE={};renderLog();
    var base=withCreds(S.manage?{}:{botToken:$('botToken').value.trim(),tmdbKey:$('tmdbKey').value.trim()});
    var result={};
    function run(i){
      if(i>=STEP_IDS.length)return Promise.resolve(true);
      var id=STEP_IDS[i];STEP_STATE[id]='run';renderLog();S.bar=25+Math.round(i*70/STEP_IDS.length);refresh();
      return api('install/'+id,base).then(function(d){
        if(!d.ok&&id==='updates'){result.updErr=msgOf(d);STEP_STATE[id]='done';renderLog();return run(i+1);}
        if(!d.ok){fail(id,d);return false;}
        if(d.webhookUrl)result.hook=d.webhookUrl;
        if(d.botUsername)result.bot=d.botUsername;
        if(d.claimUrl)result.claim=d.claimUrl;
        if(id==='database'&&!d.skipped){
          return waitForDb(0).then(function(ready){
            if(!ready){fail(id,{fa:T.fa.dbWait,en:T.en.dbWait});return false;}
            STEP_STATE[id]='done';renderLog();return run(i+1);
          });
        }
        STEP_STATE[id]='done';renderLog();return run(i+1);
      });
    }
    return run(0).then(function(ok){
      if(!ok)return;
      S.bar=100;refresh();
      var botName=result.bot||S.bot||'';
      $('rBot').textContent=botName?'@'+botName:'';$('rHook').textContent=result.hook||location.origin+'/webhook';
      $('rOpen').href='https://t.me/'+encodeURIComponent(botName);
      if(result.claim){$('rOwn').href=result.claim;$('ownBox').classList.remove('hidden');}
      var note=$('updNote');
      if(wantUpd){note.textContent=result.updErr?('⚠️ '+T[lang].updOff+result.updErr):('✅ '+T[lang].updOn);note.classList.remove('hidden');}
      $('progressCard').classList.add('hidden');$('resultCard').classList.remove('hidden');
      $('reqBanner').classList.add('hidden');$('doneBanner').classList.remove('hidden');
      $('resultCard').scrollIntoView({behavior:'smooth',block:'start'});
      $('cfToken').value='';$('setupKey').value='';$('botToken').value='';$('tmdbKey').value='';
      $('manageBox').classList.add('hidden');
      S.busy=false;
    });
  });
}
$('install').onclick=function(){install(false)};
$('manageBtn').onclick=function(){install(true)};
$('retry').onclick=function(){install(S.manage)};

var cps=document.querySelectorAll('[data-copy]');
for(var c=0;c<cps.length;c++){cps[c].onclick=function(){var t=$(this.getAttribute('data-copy')).textContent;var b=this;
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){var o=b.textContent;b.textContent='✓';setTimeout(function(){b.textContent=o},1200)}).catch(function(){});};}

applyTheme(document.documentElement.getAttribute('data-theme')||'dark');applyLang();
getStatus().then(function(s){
  if(!s)return;
  S.info=s;
  if(s.installer){
    $('inst').classList.remove('hidden');
    ['s1','s2','s3'].forEach(function(id){$(id).classList.add('hidden')});
    $('reqBanner').classList.add('hidden');$('doneBanner').classList.add('hidden');
    return;
  }
  $('reqBanner').classList.toggle('hidden',!!s.configured);
  $('doneBanner').classList.toggle('hidden',!s.configured);
  if(!s.canUseToken){setMode('key');var cfTab=document.querySelector('[data-tab="cf"]');cfTab.disabled=true;cfTab.title=T[lang].noCfHere;}
});
refresh();
})();
</script>
